name: Build and Push Docker Image

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Check for upstream updates
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      caddy_version: ${{ steps.check.outputs.caddy_version }}
    steps:
      - name: Check upstream versions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The step runs under `bash -e`, so a rate-limited response that makes
          # jq choke would fail the whole job. Both helpers fall back to an empty
          # object, and every lookup below tolerates a missing value.
          # GitHub calls are authenticated to avoid the 60/hour anonymous limit
          # that runners share by IP.
          gh_api() {
            curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" "$1" || echo '{}'
          }
          hub_api() {
            curl -sf "$1" || echo '{}'
          }

          # Get latest Caddy version from Docker Hub
          CADDY_VERSION=$(hub_api "https://hub.docker.com/v2/repositories/library/caddy/tags/?page_size=100" \
            | jq -r '(.results // [])[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$CADDY_VERSION" ]; then
            echo "Could not determine the latest Caddy version; refusing to publish an image without a version tag." >&2
            exit 1
          fi
          echo "caddy_version=${CADDY_VERSION}" >> "$GITHUB_OUTPUT"

          # Get current caddy:alpine digest
          UPSTREAM_DIGEST=$(hub_api "https://hub.docker.com/v2/repositories/library/caddy/tags/?page_size=100" \
            | jq -r '(.results // [])[] | select(.name == "alpine") | .digest')

          # Get our image's digest of the base layer (stored as label)
          OUR_DIGEST=$(hub_api "https://hub.docker.com/v2/repositories/bpopovych/caddy-cloudflare-l4/tags/?page_size=10" \
            | jq -r '(.results // [])[] | select(.name == "latest") | .digest')
          [ -n "$OUR_DIGEST" ] || OUR_DIGEST="none"

          # Get latest caddy-dns/cloudflare module version
          CF_VERSION=$(gh_api "https://api.github.com/repos/caddy-dns/cloudflare/releases/latest" \
            | jq -r '.tag_name // empty')
          if [ -z "$CF_VERSION" ]; then
            CF_VERSION=$(gh_api "https://api.github.com/repos/caddy-dns/cloudflare/tags" \
              | jq -r 'if type == "array" then (.[0].name // empty) else empty end')
          fi
          [ -n "$CF_VERSION" ] || CF_VERSION="unknown"

          # caddy-l4 has no tagged releases; report the default-branch commit that will be built
          L4_COMMIT=$(gh_api "https://api.github.com/repos/mholt/caddy-l4/commits/master" \
            | jq -r '.sha // empty' | cut -c1-7)
          [ -n "$L4_COMMIT" ] || L4_COMMIT="unknown"

          echo "Upstream caddy:alpine digest: ${UPSTREAM_DIGEST}"
          echo "Our image digest: ${OUR_DIGEST}"
          echo "Caddy version: ${CADDY_VERSION}"
          echo "Cloudflare module version: ${CF_VERSION}"
          echo "caddy-l4 commit: ${L4_COMMIT}"

          # Always build on push/manual trigger; on schedule, build if digests differ or our image doesn't exist
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "$OUR_DIGEST" = "none" ] || [ "$UPSTREAM_DIGEST" != "$OUR_DIGEST" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes detected, skipping build."
          fi

  build:
    name: Build multi-platform image
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No QEMU: the Dockerfile cross-compiles with Go and the final stage only
      # copies, so nothing ever executes on the target platform.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: bpopovych/caddy-cloudflare-l4
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check.outputs.caddy_version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/s390x
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Caddy with Cloudflare DNS and Layer 4
            org.opencontainers.image.description=Caddy web server with caddy-dns/cloudflare module for DNS-01 ACME validation and caddy-l4 for TCP/UDP proxying
            org.opencontainers.image.source=https://github.com/bpopovych/caddy-cloudflare-l4
            org.opencontainers.image.version=${{ needs.check.outputs.caddy_version }}
